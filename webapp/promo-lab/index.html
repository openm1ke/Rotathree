<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ключевой арт RotaThree</title>
  <link rel="icon" href="../favicon.svg" />
  <style>
    :root { color-scheme: dark; --bg: #05050a; --text: #eceff9; --dim: #9aa0bd; }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
    #art { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
    #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .copy { position: absolute; display: flex; flex-direction: column; gap: 1.4vmin; color: var(--text); font-family: 'Exo 2', system-ui, sans-serif; pointer-events: none; }
    .copy[hidden] { display: none; }
    .dots { display: flex; gap: 1.1vmin; }
    .dots i { width: 2.1vmin; height: 2.1vmin; border-radius: 0.5vmin; box-shadow: 0 0 1.6vmin currentColor; background: currentColor; }
    .wordmark { margin: 0; font-weight: 900; font-style: italic; font-size: 11vmin; line-height: 0.95; letter-spacing: -0.01em; text-shadow: 0 0.6vmin 3vmin rgba(0, 0, 0, 0.55); white-space: nowrap; }
    .wordmark span { display: inline-block; }
    .tagline { margin: 0; font-weight: 600; font-size: 3.3vmin; letter-spacing: 0.04em; color: var(--text); text-shadow: 0 0.3vmin 2vmin rgba(0, 0, 0, 0.7); }
    .tagline b { font-weight: 900; font-style: italic; color: #7fd8ff; }
    /* Where the words sit, per format. */
    [data-format='16x9'] .copy, [data-format='feature'] .copy { left: 6.5vw; top: 50%; transform: translateY(-50%); }
    [data-format='feature'] .wordmark { font-size: 15vmin; }
    [data-format='feature'] .tagline { font-size: 4.6vmin; }
    [data-format='feature'] .dots i { width: 2.8vmin; height: 2.8vmin; }
    [data-format='9x16'] .copy { left: 0; right: 0; bottom: 8vh; align-items: center; text-align: center; }
    [data-format='9x16'] .wordmark { font-size: 15.5vmin; }
    [data-format='9x16'] .tagline { font-size: 4.6vmin; }
    [data-format='1x1'] .copy { left: 0; right: 0; bottom: 6vh; align-items: center; text-align: center; }
    [data-format='1x1'] .wordmark { font-size: 11vmin; }
  </style>
</head>
<body>
  <div id="art">
    <canvas id="scene"></canvas>
    <div class="copy" id="copy">
      <div class="dots" aria-hidden="true">
        <i style="color: #ff3d5e"></i><i style="color: #3b82ff"></i><i style="color: #ffc531"></i><i style="color: #2fd985"></i><i style="color: #a65cff"></i><i style="color: #e4eafa"></i><i style="color: #ff8a2e"></i><i style="color: #2ee6f0"></i><i style="color: #ff5fb0"></i>
      </div>
      <h1 class="wordmark">ROTA<span style="color: #ff145e">T</span><span style="color: #1689ff">H</span><span style="color: #ffc400">R</span><span style="color: #00d982">E</span><span style="color: #ab50fa">E</span></h1>
      <p class="tagline" id="tagline"></p>
    </div>
  </div>
  <script type="module" src="./keyart.js"></script>
</body>
</html>
