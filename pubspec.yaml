name: rotathree
description: "RotaThree — four glasses around one centre, match three."
publish_to: 'none'
version: 0.1.0+17

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.6
  audioplayers: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/en.json
    - assets/credits/music.json
    - assets/fonts/OFL.txt
    - assets/music/playback/ambient-relaxing-loop.m4a
    - assets/music/playback/project-utopia-loop.m4a
    - assets/music/playback/chill-loopable.m4a
    - assets/music/playback/insistent-background-loop.m4a
    - assets/music/playback/claimed-by-the-void-loop.m4a

  fonts:
    - family: Exo2
      fonts:
        - asset: assets/fonts/Exo2-Latin-400.ttf
          weight: 400
        - asset: assets/fonts/Exo2-Latin-600.ttf
          weight: 600
        - asset: assets/fonts/Exo2-Latin-800.ttf
          weight: 800
        - asset: assets/fonts/Exo2-Latin-800Italic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Exo2-Latin-900Italic.ttf
          weight: 900
          style: italic
    - family: Exo2Cyrillic
      fonts:
        - asset: assets/fonts/Exo2-Cyrillic-400.ttf
          weight: 400
        - asset: assets/fonts/Exo2-Cyrillic-600.ttf
          weight: 600
        - asset: assets/fonts/Exo2-Cyrillic-800.ttf
          weight: 800
        - asset: assets/fonts/Exo2-Cyrillic-800Italic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Exo2-Cyrillic-900Italic.ttf
          weight: 900
          style: italic
