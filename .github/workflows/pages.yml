name: Deploy web version to GitHub Pages

on:
  push:
    branches: [main, codex/vk-games]
    paths:
      - 'webapp/**'
      - 'assets/i18n/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits for the running one to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      # Each site keeps its own source branch. Publish a single Pages artifact
      # so deploying either version cannot remove the other version's files.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: codex/vk-games
          path: vk-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            webapp/package-lock.json
            vk-source/webapp/package-lock.json
      - run: npm ci
      # typecheck + lint + tests + build: nothing broken gets published
      - run: npm run check
      - run: npm ci
        working-directory: vk-source/webapp
      - run: npm run check
        working-directory: vk-source/webapp
      - run: npm run build:vk
        working-directory: vk-source/webapp
      - run: cp -R vk-source/webapp/dist-vk webapp/dist/vk
        working-directory: .
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
